<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nook</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .header { background: #333; color: #fff; padding: 30px; text-align: center; margin-bottom: 30px; }
        .bookshelf { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* 书籍卡片样式 */
        .book-card {
            background: #fff; width: 160px; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-decoration: none; color: #333; transition: transform 0.2s;
            display: flex; flex-direction: column; align-items: center;
        }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .book-card img { width: 140px; height: 200px; object-fit: cover; background: #eee; border-radius: 4px; }
        .book-title { margin-top: 12px; font-weight: bold; font-size: 15px; text-align: center; 
                      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .book-author { margin-top: 5px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="header"><h1>📚 一隅</h1></div>
    <div id="bookshelf" class="bookshelf">正在加载书架...</div>

    <script>
        fetch('books.json')
            .then(res => res.json())
            .then(data => {
                const shelf = document.getElementById('bookshelf');
                shelf.innerHTML = ''; // 清空提示
                data.forEach(book => {
                    const a = document.createElement('a');
                    a.className = 'book-card';
                    // 点击跳转到 reader.html
                    a.href = `reader.html?book=${encodeURIComponent(book.url)}`;
                    a.innerHTML = `
                        <img src="${book.cover}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/140x200?text=NoCover'">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                    `;
                    shelf.appendChild(a);
                });
            })
            .catch(err => {
                document.getElementById('bookshelf').innerHTML = 
                '<h3 style="color:red">加载失败：请确保已启动本地服务器 (Live Server/Python/Node)</h3>';
            });
    </script>
</body>
</html>
